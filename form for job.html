<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Job Application</h2>
    <label for="textarea">Name:</label>
    <br>
    <input type="text" name="textarea1" id="textarea" placeholder="abc">
    <br>
    <br>
    <label for="textarea">Email:</label>
    <br>
    <input type="textarea" name="textarea2" id="textarea" placeholder="abc@gmail.com">
    <br><br>
    <label for="textarea">Phone:</label>
    <br>
    <input type="textarea" name="textarea3" id="textarea" placeholder="9140736273">
    <br><br>
    <label for="filetype">Resume:</label><br><br>
    <input type="file" name="filetype1" id="filetype">
    <br><br>
    <label for="option">Experience(years):</label>
    <br>
    <select name="option" id="optiontype">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option> 
    </select>   
    <br>
    <fieldset>
        <legend>Skills:</legend>
        <input type="checkbox" name="checkbox1" id="checkbox"><br>
       <label for="checkbox">HTML</label>
       <br>
        <input type="checkbox" name="checkbox1" id="checkbox"><br>
       <label for="checkbox">CSS</label>
       <br>
        <input type="checkbox" name="checkbox1" id="checkbox"><br>
       <label for="checkbox">Java Script</label>
       <br><br>
    </fieldset>
       <legend>Highest Education</legend><br>
       <select name="optiontype" id="option">
        <option value="High School">High School</option>
        <option value="Intermediate">Intermediate</option>
       </select>
       <br>
       <legend>Availability:</legend>
       <input type="radio" name="radiobutton type" id="radio"><br>
       <label for="radio">Full-time</label><br>
       <br>
       <input type="radio" name="radiobutton type" id="radio"><br>
       <label for="radio">Part-time</label><br>
       <br>
      <legend>Additional Comments:</legend>
      <textarea name="textarea" id="textarea1" cols="40" rows="5"></textarea><br>
      <input type="submit" value="Submit Application">
    </fieldset>


    
</body>
</html>
